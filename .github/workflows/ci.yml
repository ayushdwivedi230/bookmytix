name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Run tests
        # Tests use an in-memory stub — no DATABASE_URL needed
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          NODE_ENV: test
        run: npm test

      - name: Build
        env:
          # JWT_SECRET is required at esbuild time (server.ts startup check is runtime-only)
          JWT_SECRET: ci-build-secret-placeholder
          NODE_ENV: production
        run: npm run build
